name: Bug report
description: Report a LidLock bug or compatibility issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: lidlock-version
    attributes:
      label: LidLock version
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Area
      options:
        - Screen On, Lid Open
        - Screen Off, Lid Open
        - Screen On, Lid Closed
        - Screen Off, Lid Closed
        - Stop Keeping Awake
        - Open at login
        - Menu bar
        - Allow lid changes without a password
        - Installation or download
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra context
      description: Add logs or screenshots only if they do not contain sensitive information.
